<!doctype html>
<html dir="ltr" lang="en">
  <head>
    <meta name="color-scheme" content="light dark" />
    <script>(function(){var p='cineflix',t,c;try{t=JSON.parse(localStorage.getItem(p+'-theme'))}catch(e){}try{c=JSON.parse(localStorage.getItem(p+'-contrast'))}catch(e){}var r=document.documentElement;r.dataset.theme=t==='light'||t==='dark'?t:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';r.dataset.contrast=c==='standard'||c==='more'?c:matchMedia('(prefers-contrast: more)').matches?'more':'standard';r.style.colorScheme=r.dataset.theme})()</script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101310" />
    <meta
      name="description"
      content="A considered collection for the endlessly curious. Cineflix is a film discovery experience by Ignatius Seto, built with Stencil and native web components."
    />
    <title>Cineflix — Good films. Great evenings.</title>
    <link rel="preconnect" href="https://image.tmdb.org" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <script type="module" src="/build/cineflix.esm.js"></script>
    <link rel="stylesheet" href="/build/cineflix.css" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <cineflix-app></cineflix-app>
    <noscript>Cineflix needs JavaScript to display its interactive film collection. Enable JavaScript and reload to explore.</noscript>
  </body>
</html>
